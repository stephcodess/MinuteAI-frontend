services:
  - type: web
    name: minuteai-frontend
    runtime: static
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://minuteai-backend.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        value: 625680446331-drv4lb8ajnt1959986mucok1nuaidjm1.apps.googleusercontent.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
